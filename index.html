<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail & App Password Checker</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f3f6; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: auto; background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; }
        label { font-weight: bold; margin-bottom: 6px; display: block; color: #333; }
        textarea { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: monospace; font-size: 13px; resize: vertical; white-space: pre; }
        .input-box { height: 180px; }
        .btn-group { display: flex; gap: 12px; margin-top: 12px; }
        button { flex: 1; padding: 12px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-start { background: #28a745; color: white; }
        .btn-start:disabled { background: #88c898; cursor: not-allowed; }
        .btn-stop { background: #dc3545; color: white; }
        .btn-stop:disabled { background: #e68d96; cursor: not-allowed; }
        .btn-copy { width: 100%; padding: 10px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin-top: 6px; }
        .btn-copy-success { background: #28a745; color: white; }
        .btn-copy-failed { background: #dc3545; color: white; }
        .stats-bar { margin-top: 18px; padding: 14px; background: #e8f0fe; border-left: 5px solid #1a73e8; border-radius: 4px; font-size: 16px; font-weight: bold; color: #1967d2; }
        .result-grid { display: flex; gap: 15px; margin-top: 20px; }
        .result-col { flex: 1; }
        .result-col textarea { height: 160px; background: #fdfdfd; }
        .log-box { margin-top: 20px; height: 150px; overflow-y: auto; background: #1e1e1e; color: #2ecc71; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Gmail Background Checker (Sheet Ready)</h2>
    
    <label>আপনার সম্পূর্ণ ডেটা এখানে পেস্ট করুন (Sheet থেকে একবারে পেস্ট করতে পারেন):</label>
    <textarea id="rawInput" class="input-box" placeholder="exavijequpe45@gmail.com	pm0R8so1tQFY	obd4drjlykze3yqwmvv6a3r2kkwfvkx6	cshlimsffjyoltjf"></textarea>

    <div class="btn-group">
        <button id="startBtn" class="btn-start" onclick="startChecker()">Check শুরু করুন (30s Delay)</button>
        <button id="stopBtn" class="btn-stop" onclick="stopChecker()" disabled>Stop করুন</button>
    </div>

    <div class="stats-bar" id="stats">
        Status: নিষ্ক্রিয় | Total: 0 | Checked: 0 | Success: 0 ✅ | Failed: 0 ❌
    </div>

    <div class="result-grid">
        <div class="result-col">
            <label style="color:#28a745;">✅ ভালো জিমেইল (Success):</label>
            <textarea id="successArea" readonly></textarea>
            <button class="btn-copy btn-copy-success" onclick="copyData('successArea')">কপি Success List (Sheets-এ পেস্ট করুন)</button>
        </div>
        <div class="result-col">
            <label style="color:#dc3545;">❌ বাদ জিমেইল (Failed):</label>
            <textarea id="failedArea" readonly></textarea>
            <button class="btn-copy btn-copy-failed" onclick="copyData('failedArea')">কপি Failed List (Sheets-এ পেস্ট করুন)</button>
        </div>
    </div>

    <label style="margin-top:20px;">লাইভ লগ:</label>
    <div class="log-box" id="logs">লগ এখানে দেখা যাবে...</div>
</div>

<script>
async function fetchStatus() {
    try {
        const res = await fetch('/status');
        const data = await res.json();

        document.getElementById('startBtn').disabled = data.isRunning;
        document.getElementById('stopBtn').disabled = !data.isRunning;

        document.getElementById('successArea').value = data.successList.join('\n');
        document.getElementById('failedArea').value = data.failedList.join('\n');

        const stateText = data.isRunning ? "চলছে (30s পর পর) ⏳" : "নিষ্ক্রিয় / সম্পন্ন";
        document.getElementById('stats').innerText = 
            `Status: ${stateText} | Total: ${data.total} | Checked: ${data.checked} | Success: ${data.successCount} ✅ | Failed: ${data.failedCount} ❌`;

        const logBox = document.getElementById('logs');
        if (data.logs.length > 0) {
            logBox.innerHTML = data.logs.join('<br>');
            logBox.scrollTop = logBox.scrollHeight;
        }

    } catch (e) {
        console.error("স্ট্যাটাস পাওয়া যায়নি", e);
    }
}

async function startChecker() {
    const rawData = document.getElementById('rawInput').value.trim();

    if (!rawData) {
        alert("দয়া করে ডেটা পেস্ট করুন!");
        return;
    }

    try {
        const res = await fetch('/start', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ data: rawData })
        });
        const data = await res.json();
        
        if (data.status === 'success') {
            fetchStatus();
        } else {
            alert(data.message);
        }
    } catch (err) {
        alert("সার্ভার এরর!");
    }
}

async function stopChecker() {
    try {
        const res = await fetch('/stop', { method: 'POST' });
        const data = await res.json();
        alert(data.message);
        fetchStatus();
    } catch (err) {
        alert("থামানো যায়নি!");
    }
}

function copyData(areaId) {
    const area = document.getElementById(areaId);
    if (!area.value.trim()) {
        alert("কপি করার জন্য কোনো ডেটা নেই!");
        return;
    }
    area.select();
    navigator.clipboard.writeText(area.value);
    alert("কপি করা হয়েছে! সরাসরি Google Sheet-এ Paste (Ctrl+V) করুন।");
}

setInterval(fetchStatus, 3000);
fetchStatus();
</script>

</body>
</html>
