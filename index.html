<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gmail App Password Checker</title>
<style>
  :root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --muted:#6b7280;
    --accent:#0ea5e9;
    --success:#16a34a;
    --danger:#ef4444;
    --line:#e6eef6;
    --max-width:820px;
    --mono: 13px/1.4 "Courier New", monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
    color:#0f172a;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:20px;
  }
  .card{
    width:100%;
    max-width:var(--max-width);
    background:var(--card);
    border-radius:12px;
    padding:18px;
    box-shadow:0 6px 20px rgba(16,24,40,0.08);
    border:1px solid var(--line);
  }
  .head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .logo{
    width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#60a5fa,#06b6d4);display:grid;place-items:center;color:white;font-weight:700;font-size:18px
  }
  h1{margin:0;font-size:16px}
  .sub{margin:0;color:var(--muted);font-size:13px}
  .grid{display:flex;gap:12px;margin-top:12px}
  .col{flex:1;display:flex;flex-direction:column;gap:8px}
  label{font-size:13px;color:#0b1220;font-weight:600}
  textarea{
    width:100%;
    min-height:140px;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    font-size:14px;
    resize:vertical;
    background:#fff;
    color:#0b1220;
    outline:none;
  }
  textarea::placeholder{color:#9aa6b2}
  .controls{display:flex;gap:10px;margin-top:12px}
  button.primary{
    flex:1;padding:12px;border-radius:10px;border:0;background:var(--accent);color:white;font-weight:700;cursor:pointer;
  }
  button.ghost{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
  button:disabled{opacity:0.6;cursor:not-allowed}
  .stats{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:10px;border-radius:10px;background:linear-gradient(180deg,#ffffff,#fbfdff);border:1px solid var(--line)}
  .summary{font-weight:700;color:#0b1220}
  .counts{color:var(--muted);font-weight:600}
  .progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden;flex:1;margin-left:12px;margin-right:12px}
  .bar{height:100%;background:linear-gradient(90deg,#60a5fa,#06b6d4);width:0%}
  .log{margin-top:12px;height:360px;overflow:auto;border-radius:10px;padding:10px;background:#ffffff;border:1px solid var(--line);font:var(--mono);color:#0b1220}
  .row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:8px;margin-bottom:6px}
  .idx{min-width:36px;color:#94a3b8;font-weight:700}
  .email{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .status{min-width:140px;text-align:right;font-weight:700}
  .ok{background:linear-gradient(90deg, rgba(22,163,74,0.12), rgba(22,163,74,0.06));color:var(--success)}
  .bad{background:linear-gradient(90deg, rgba(239,68,68,0.06), rgba(239,68,68,0.03));color:var(--danger)}
  .info{background:transparent;color:var(--muted)}
  .note{font-size:12px;color:var(--muted);margin-top:10px}
  @media (max-width:760px){
    .grid{flex-direction:column}
    .log{height:220px}
    textarea{min-height:100px}
  }
</style>
</head>
<body>
  <div class="card" role="main">
    <div class="head">
      <div class="logo">G</div>
      <div>
        <h1>Gmail App Password Checker</h1>
        <p class="sub">Clean, minimal UI — sequential checks</p>
      </div>
    </div>

    <div class="grid">
      <div class="col">
        <label for="emails">Emails (one per line)</label>
        <textarea id="emails" placeholder="alice@gmail.com
bob@gmail.com" inputmode="email" spellcheck="false"></textarea>
      </div>
      <div class="col">
        <label for="passwords">App passwords (one per line)</label>
        <textarea id="passwords" placeholder="abcd efgh ijkl mnop
qrst uvwx yzab cdef" spellcheck="false"></textarea>
      </div>
    </div>

    <div class="controls">
      <button id="checkBtn" class="primary" type="button">Check</button>
      <button id="clearBtn" class="ghost" type="button">Clear Logs</button>
    </div>

    <div class="stats" aria-live="polite">
      <div class="summary" id="summary">Ready — 0 total</div>
      <div style="display:flex;align-items:center;flex:1">
        <div class="counts" id="counts">0 ✅ | 0 ❌</div>
        <div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>
      </div>
    </div>

    <div id="logs" class="log" aria-live="polite" aria-atomic="false">
      1) Results will appear here...
    </div>

    <div class="note" id="note">Endpoint: POST /check-single — payload: { "email", "password" } — expects { "isValid": true/false }</div>
  </div>

<script>
/*
 - Sequential checking (one by one) following original logic.
 - Duplicate emails are removed (first occurrence kept) so each email is shown once.
 - UI locked during checking.
 - Success rows show full-line green styling.
 - Minimal text UI.
*/

(function(){
  const emailsEl = document.getElementById('emails');
  const passwordsEl = document.getElementById('passwords');
  const checkBtn = document.getElementById('checkBtn');
  const clearBtn = document.getElementById('clearBtn');
  const logsEl = document.getElementById('logs');
  const summaryEl = document.getElementById('summary');
  const countsEl = document.getElementById('counts');
  const barEl = document.getElementById('bar');
  const noteEl = document.getElementById('note');

  const TIMEOUT_MS = 25000;
  const MAX_LOGS = 400;

  function splitLines(s){
    return (s || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  }

  function setRunning(r){
    checkBtn.disabled = r;
    checkBtn.textContent = r ? 'Checking...' : 'Check';
    emailsEl.readOnly = r;
    passwordsEl.readOnly = r;
  }

  function appendRow(i, email, statusText, kind){
    // kind: 'ok'|'bad'|'info'
    // Ensure one row per email display is enforced by dedupe earlier
    const row = document.createElement('div');
    row.className = 'row ' + (kind === 'ok' ? 'ok' : kind === 'bad' ? 'bad' : 'info');

    const idx = document.createElement('div'); idx.className='idx'; idx.textContent = i;
    const em = document.createElement('div'); em.className='email'; em.textContent = email;
    const st = document.createElement('div'); st.className='status'; st.textContent = statusText;

    row.appendChild(idx);
    row.appendChild(em);
    row.appendChild(st);
    logsEl.appendChild(row);

    // scroll
    logsEl.scrollTop = logsEl.scrollHeight;

    // trim
    while (logsEl.children.length > MAX_LOGS) logsEl.removeChild(logsEl.firstChild);
  }

  function updateSummary(total, done, ok, failed){
    summaryEl.textContent = `Total ${total} • Done ${done}`;
    countsEl.textContent = `${ok} ✅ | ${failed} ❌`;
    const pct = total === 0 ? 0 : Math.round((done/total)*100);
    barEl.style.width = pct + '%';
  }

  function timeoutSignal(ms){
    const ac = new AbortController();
    const id = setTimeout(()=>ac.abort(), ms);
    return {signal: ac.signal, clear: ()=>clearTimeout(id)};
  }

  async function postCheck(email, password){
    const {signal, clear} = timeoutSignal(TIMEOUT_MS);
    try {
      const res = await fetch('/check-single', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, password }),
        signal
      });
      clear();
      if (!res.ok) return { ok: false, err: `HTTP ${res.status}` };
      const data = await res.json();
      return { ok: !!(data && data.isValid) };
    } catch (err) {
      const errName = err && err.name === 'AbortError' ? 'Timeout' : 'Network';
      return { ok: false, err: errName };
    }
  }

  checkBtn.addEventListener('click', async () => {
    const emails = splitLines(emailsEl.value);
    const passwords = splitLines(passwordsEl.value);

    if (emails.length === 0 || passwords.length === 0){
      alert('Please fill both lists.');
      return;
    }
    if (emails.length !== passwords.length){
      alert(`Email count (${emails.length}) and password count (${passwords.length}) are not equal.`);
      return;
    }

    // Build deduped pairs (keep first occurrence)
    const seen = new Set();
    const pairs = [];
    for (let i=0;i<emails.length;i++){
      const e = emails[i];
      const p = passwords[i];
      if (!seen.has(e.toLowerCase())){
        seen.add(e.toLowerCase());
        pairs.push({ email: e, password: p });
      }
    }
    const duplicatesRemoved = emails.length - pairs.length;

    setRunning(true);
    logsEl.innerHTML = ''; // fresh
    appendRow(1, '—', 'Starting...', 'info');

    if (duplicatesRemoved > 0) {
      appendRow(2, '—', `Duplicates removed: ${duplicatesRemoved}`, 'info');
    }

    let ok = 0, failed = 0, done = 0;
    updateSummary(pairs.length, done, ok, failed);

    for (let i=0;i<pairs.length;i++){
      const pair = pairs[i];
      const idx = i+1;
      appendRow(idx, pair.email, 'Checking...', 'info');

      const r = await postCheck(pair.email, pair.password);
      if (r.ok){
        ok++;
        appendRow(idx, pair.email, 'Success ✅', 'ok');
      } else {
        failed++;
        appendRow(idx, pair.email, `Failed ❌ ${r.err ? '('+r.err+')' : ''}`, 'bad');
      }
      done++;
      updateSummary(pairs.length, done, ok, failed);

      // small yield to keep UI responsive on low-end devices
      await new Promise(res=>setTimeout(res,30));
    }

    appendRow(pairs.length + 2, '—', `Completed: ${ok} success, ${failed} failed`, 'info');
    updateSummary(pairs.length, pairs.length, ok, failed);
    setRunning(false);
  });

  clearBtn.addEventListener('click', () => {
    logsEl.innerHTML = '';
    updateSummary(0,0,0,0);
  });

  // initial
  updateSummary(0,0,0,0);
})();
</script>
</body>
</html>
