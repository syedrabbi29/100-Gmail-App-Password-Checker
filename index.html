<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f7fb">

<title>Account Checker</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#18202a;
    --muted:#77808d;
    --border:#e7ebf1;
    --blue:#2563eb;
    --green:#16a34a;
    --red:#dc2626;
    --gray:#64748b;
    --shadow:0 7px 25px rgba(20,30,50,.06);
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    padding:14px;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI",Roboto,Arial,sans-serif;
}

.container{
    width:100%;
    max-width:980px;
    margin:0 auto;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    gap:12px;
    margin:4px 2px 15px;
}

.logo{
    width:44px;
    height:44px;
    border-radius:13px;
    background:#eaf1ff;
    color:var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo svg{
    width:22px;
    height:22px;
}

.header h1{
    margin:0;
    font-size:20px;
    line-height:1.2;
}

.header p{
    margin:4px 0 0;
    color:var(--muted);
    font-size:11px;
}

/* CARD */

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
}

/* LABEL */

.label{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    font-weight:700;
    margin-bottom:8px;
}

.label svg{
    width:16px;
    height:16px;
    flex:none;
}

/* TEXTAREA */

textarea{
    width:100%;
    display:block;
    border:1px solid var(--border);
    border-radius:11px;
    outline:none;
    background:#fafbfd;
    color:var(--text);
    padding:12px;
    font-family:monospace;
    font-size:12px;
    line-height:1.5;
    resize:vertical;
}

textarea:focus{
    border-color:#9db9fa;
    background:#fff;
}

.input-box{
    height:180px;
    min-height:130px;
}

.result-area{
    height:160px;
    min-height:120px;
}

/* BUTTONS */

.btn-group{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:11px;
}

button{
    border:none;
    outline:none;
    min-height:44px;
    padding:10px 13px;
    border-radius:11px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    transition:.15s ease;
}

button:active{
    transform:scale(.98);
}

button:disabled{
    opacity:.42;
    cursor:not-allowed;
    transform:none;
}

button svg{
    width:16px;
    height:16px;
}

.btn-start{
    background:var(--green);
    color:#fff;
}

.btn-stop{
    background:var(--red);
    color:#fff;
}

.btn-clear{
    width:100%;
    margin-top:9px;
    background:#64748b;
    color:#fff;
}

/* STATS */

.stats-card{
    padding:14px;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.stat{
    background:#fafbfd;
    border:1px solid var(--border);
    border-radius:12px;
    padding:11px 6px;
    text-align:center;
}

.stat-icon{
    width:29px;
    height:29px;
    margin:0 auto 5px;
    border-radius:9px;
    background:#edf2ff;
    color:var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:800;
}

.stat strong{
    display:block;
    font-size:17px;
    line-height:1.2;
}

.stat span{
    display:block;
    margin-top:3px;
    color:var(--muted);
    font-size:10px;
}

.status-line{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:10px;
    padding:9px 11px;
    background:#f7f8fa;
    border-radius:10px;
    color:var(--muted);
    font-size:11px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#94a3b8;
}

.status-dot.running{
    background:var(--green);
}

/* RESULTS */

.result-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.result-card{
    min-width:0;
}

.result-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
}

.result-name{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    font-weight:700;
}

.success-name{
    color:var(--green);
}

.failed-name{
    color:var(--red);
}

.badge{
    min-width:25px;
    padding:4px 7px;
    text-align:center;
    border-radius:20px;
    background:#f1f3f6;
    color:var(--muted);
    font-size:10px;
    font-weight:700;
}

.copy-btn{
    width:100%;
    margin-top:7px;
    background:#f1f4f8;
    color:#374151;
}

.copy-btn:hover{
    background:#e9edf2;
}

/* LOG */

.log-box{
    height:150px;
    overflow-y:auto;
    background:#111827;
    color:#8df0ae;
    padding:11px;
    border-radius:11px;
    font-family:monospace;
    font-size:11px;
    line-height:1.7;
    word-break:break-word;
}

.log-box::-webkit-scrollbar{
    width:4px;
}

.log-box::-webkit-scrollbar-thumb{
    background:#374151;
    border-radius:10px;
}

/* TOAST */

.toast-container{
    position:fixed;
    top:14px;
    right:14px;
    left:14px;
    z-index:9999;
    pointer-events:none;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
}

.toast{
    width:min(360px,100%);
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 13px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:13px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    animation:toastIn .2s ease;
}

.toast-icon{
    width:30px;
    height:30px;
    border-radius:9px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:800;
}

.toast-text{
    font-size:12px;
    font-weight:600;
    line-height:1.4;
}

.toast.success .toast-icon{
    background:#eaf8ef;
    color:var(--green);
}

.toast.error .toast-icon{
    background:#fdecec;
    color:var(--red);
}

.toast.info .toast-icon{
    background:#edf3ff;
    color:var(--blue);
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateY(-8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* MOBILE */

@media(max-width:650px){

    body{
        padding:10px;
    }

    .card{
        padding:13px;
        border-radius:14px;
    }

    .header h1{
        font-size:18px;
    }

    .stats-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .result-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:360px){

    .btn-group{
        grid-template-columns:1fr;
    }

    .input-box{
        height:160px;
    }

    .result-area{
        height:140px;
    }
}
</style>
</head>

<body>

<div id="toastContainer" class="toast-container"></div>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <rect x="3" y="5"
                      width="18"
                      height="14"
                      rx="3"/>

                <path d="m4 7 8 6 8-6"/>

            </svg>

        </div>

        <div>
            <h1>Account Checker</h1>
            <p>Lightweight checker • Mobile optimized</p>
        </div>

    </div>


    <!-- INPUT -->

    <div class="card">

        <div class="label">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <path d="M4 4h16v16H4z"/>
                <path d="M8 8h8"/>
                <path d="M8 12h8"/>
                <path d="M8 16h5"/>

            </svg>

            Input Data

        </div>

        <textarea
            id="rawInput"
            class="input-box"
            placeholder="Paste your data here..."
        ></textarea>


        <div class="btn-group">

            <button
                id="startBtn"
                class="btn-start"
                onclick="startChecker()">

                <svg viewBox="0 0 24 24"
                     fill="currentColor">

                    <path d="M8 5v14l11-7z"/>

                </svg>

                Start

            </button>


            <button
                id="stopBtn"
                class="btn-stop"
                onclick="stopChecker()"
                disabled>

                <svg viewBox="0 0 24 24"
                     fill="currentColor">

                    <path d="M7 7h10v10H7z"/>

                </svg>

                Stop

            </button>

        </div>


        <button
            id="clearBtn"
            class="btn-clear"
            onclick="clearAll()"
            disabled>

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <path d="M3 6h18"/>
                <path d="M8 6V4h8v2"/>
                <path d="m19 6-1 15H6L5 6"/>
                <path d="M10 11v6"/>
                <path d="M14 11v6"/>

            </svg>

            Clear All

        </button>

    </div>


    <!-- STATS -->

    <div class="card stats-card">

        <div class="label">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <path d="M3 3v18h18"/>
                <path d="m7 16 4-5 3 3 5-7"/>

            </svg>

            Statistics

        </div>


        <div class="stats-grid">

            <div class="stat">

                <div class="stat-icon">T</div>

                <strong id="totalStat">0</strong>

                <span>Total</span>

            </div>


            <div class="stat">

                <div class="stat-icon">C</div>

                <strong id="checkedStat">0</strong>

                <span>Checked</span>

            </div>


            <div class="stat">

                <div class="stat-icon">✓</div>

                <strong id="successStat">0</strong>

                <span>Success</span>

            </div>


            <div class="stat">

                <div class="stat-icon">×</div>

                <strong id="failedStat">0</strong>

                <span>Failed</span>

            </div>

        </div>


        <div class="status-line" id="statusLine">

            <span class="status-dot"></span>

            <span>System is idle</span>

        </div>

    </div>


    <!-- RESULTS -->

    <div class="result-grid">

        <!-- SUCCESS -->

        <div class="card result-card">

            <div class="result-title">

                <div class="result-name success-name">

                    <span>✓</span>
                    <span>Success</span>

                </div>

                <span
                    class="badge"
                    id="successBadge">
                    0
                </span>

            </div>


            <textarea
                id="successArea"
                class="result-area"
                readonly
            ></textarea>


            <button
                class="copy-btn"
                onclick="copyData('successArea')">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <rect x="9" y="9"
                          width="12"
                          height="12"
                          rx="2"/>

                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>

                </svg>

                Copy Success

            </button>

        </div>


        <!-- FAILED -->

        <div class="card result-card">

            <div class="result-title">

                <div class="result-name failed-name">

                    <span>×</span>
                    <span>Failed</span>

                </div>

                <span
                    class="badge"
                    id="failedBadge">
                    0
                </span>

            </div>


            <textarea
                id="failedArea"
                class="result-area"
                readonly
            ></textarea>


            <button
                class="copy-btn"
                onclick="copyData('failedArea')">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <rect x="9" y="9"
                          width="12"
                          height="12"
                          rx="2"/>

                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>

                </svg>

                Copy Failed

            </button>

        </div>

    </div>


    <!-- LOG -->

    <div class="card">

        <div class="label">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <path d="M4 4h16v16H4z"/>
                <path d="M7 8h10"/>
                <path d="M7 12h7"/>
                <path d="M7 16h9"/>

            </svg>

            Live Activity

        </div>


        <div
            class="log-box"
            id="logs">
            Waiting for activity...
        </div>

    </div>

</div>


<script>

/* =========================================
   STATUS
   ========================================= */

async function fetchStatus(){

    try{

        const res =
            await fetch('/status');

        const data =
            await res.json();


        /*
         * Button state
         */

        document.getElementById('startBtn').disabled =
            data.isRunning;

        document.getElementById('stopBtn').disabled =
            !data.isRunning;

        /*
         * Clear is only available
         * when checker is stopped.
         */

        document.getElementById('clearBtn').disabled =
            data.isRunning;


        /*
         * Results
         */

        document.getElementById('successArea').value =
            data.successList.join('\n');

        document.getElementById('failedArea').value =
            data.failedList.join('\n');


        /*
         * Statistics
         */

        document.getElementById('totalStat').innerText =
            data.total;

        document.getElementById('checkedStat').innerText =
            data.checked;

        document.getElementById('successStat').innerText =
            data.successCount;

        document.getElementById('failedStat').innerText =
            data.failedCount;


        document.getElementById('successBadge').innerText =
            data.successCount;

        document.getElementById('failedBadge').innerText =
            data.failedCount;


        /*
         * Status
         */

        const statusLine =
            document.getElementById('statusLine');


        if(data.isRunning){

            statusLine.innerHTML =
                '<span class="status-dot running"></span>' +
                '<span>Checking is running...</span>';

        }else{

            statusLine.innerHTML =
                '<span class="status-dot"></span>' +
                '<span>System is idle / completed</span>';

        }


        /*
         * Logs
         */

        const logBox =
            document.getElementById('logs');


        if(data.logs && data.logs.length){

            logBox.innerHTML =
                data.logs.join('<br>');

            logBox.scrollTop =
                logBox.scrollHeight;

        }else{

            logBox.innerHTML =
                'Waiting for activity...';

        }

    }catch(e){

        console.error(
            'Status unavailable',
            e
        );

    }
}


/* =========================================
   START
   ========================================= */

async function startChecker(){

    const rawData =
        document
        .getElementById('rawInput')
        .value
        .trim();


    if(!rawData){

        showToast(
            'Please paste your data first.',
            'error'
        );

        return;
    }


    try{

        const res =
            await fetch('/start',{

                method:'POST',

                headers:{
                    'Content-Type':
                    'application/json'
                },

                body:JSON.stringify({
                    data:rawData
                })

            });


        const data =
            await res.json();


        if(data.status === 'success'){

            showToast(
                'Checking started successfully.',
                'success'
            );

            fetchStatus();

        }else{

            showToast(
                data.message ||
                'Unable to start.',
                'error'
            );

        }

    }catch(err){

        showToast(
            'Server error.',
            'error'
        );

    }
}


/* =========================================
   STOP
   ========================================= */

async function stopChecker(){

    try{

        const res =
            await fetch('/stop',{
                method:'POST'
            });


        const data =
            await res.json();


        if(data.status === 'success'){

            showToast(
                'Stop request sent.',
                'info'
            );

        }else{

            showToast(
                data.message ||
                'Nothing is running.',
                'error'
            );

        }


        fetchStatus();


    }catch(err){

        showToast(
            'Unable to stop the process.',
            'error'
        );

    }
}


/* =========================================
   CLEAR
   ========================================= */

async function clearAll(){

    /*
     * No browser confirm().
     * Custom toast only.
     */

    try{

        const res =
            await fetch('/clear',{
                method:'POST'
            });


        const data =
            await res.json();


        if(data.status === 'success'){

            document.getElementById(
                'rawInput'
            ).value = '';

            document.getElementById(
                'successArea'
            ).value = '';

            document.getElementById(
                'failedArea'
            ).value = '';

            document.getElementById(
                'logs'
            ).innerHTML =
                'Waiting for activity...';


            document.getElementById(
                'totalStat'
            ).innerText = '0';

            document.getElementById(
                'checkedStat'
            ).innerText = '0';

            document.getElementById(
                'successStat'
            ).innerText = '0';

            document.getElementById(
                'failedStat'
            ).innerText = '0';

            document.getElementById(
                'successBadge'
            ).innerText = '0';

            document.getElementById(
                'failedBadge'
            ).innerText = '0';


            document.getElementById(
                'statusLine'
            ).innerHTML =
                '<span class="status-dot"></span>' +
                '<span>System is idle</span>';


            showToast(
                data.message ||
                'All data cleared successfully.',
                'success'
            );


            fetchStatus();

        }else{

            showToast(
                data.message ||
                'Unable to clear data.',
                'error'
            );

        }

    }catch(err){

        showToast(
            'Clear request failed.',
            'error'
        );

    }
}


/* =========================================
   COPY
   ========================================= */

async function copyData(areaId){

    const area =
        document.getElementById(areaId);


    if(!area.value.trim()){

        showToast(
            'Nothing to copy.',
            'error'
        );

        return;
    }


    try{

        await navigator.clipboard.writeText(
            area.value
        );

        showToast(
            'Copied successfully.',
            'success'
        );

    }catch(err){

        area.select();

        document.execCommand('copy');

        showToast(
            'Copied successfully.',
            'success'
        );

    }
}


/* =========================================
   TOAST
   ========================================= */

function showToast(
    message,
    type='info'
){

    const container =
        document.getElementById(
            'toastContainer'
        );


    const toast =
        document.createElement('div');


    toast.className =
        'toast ' + type;


    let icon = 'i';

    if(type === 'success'){
        icon = '✓';
    }

    if(type === 'error'){
        icon = '!';
    }


    toast.innerHTML = `
        <div class="toast-icon">
            ${icon}
        </div>

        <div class="toast-text">
            ${message}
        </div>
    `;


    container.appendChild(toast);


    setTimeout(()=>{

        toast.style.opacity='0';
        toast.style.transform=
            'translateY(-6px)';

        toast.style.transition=
            '.18s ease';


        setTimeout(()=>{

            if(toast.parentNode){
                toast.remove();
            }

        },180);

    },2500);
}


/* =========================================
   POLLING
   ========================================= */

setInterval(
    fetchStatus,
    3000
);


/* =========================================
   INITIAL LOAD
   ========================================= */

fetchStatus();

</script>

</body>
</html>
