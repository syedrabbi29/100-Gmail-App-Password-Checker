<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gmail App Password Checker</title>
<style>
  :root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --muted:#6b7280;
    --accent:#0ea5e9;
    --success:#16a34a;
    --danger:#ef4444;
    --line:#e6eef6;
    --max-width:820px;
    --mono: 13px/1.4 "Courier New", monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
    color:#0f172a;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:20px;
  }
  .card{
    width:100%;
    max-width:var(--max-width);
    background:var(--card);
    border-radius:12px;
    padding:18px;
    box-shadow:0 6px 20px rgba(16,24,40,0.08);
    border:1px solid var(--line);
  }
  .head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .logo{
    width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#60a5fa,#06b6d4);display:grid;place-items:center;color:white;font-weight:700;font-size:18px
  }
  h1{margin:0;font-size:16px}
  .sub{margin:0;color:var(--muted);font-size:13px}
  .grid{display:flex;gap:12px;margin-top:12px}
  .col{flex:1;display:flex;flex-direction:column;gap:8px}
  label{font-size:13px;color:#0b1220;font-weight:600}
  textarea{
    width:100%;
    min-height:140px;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    font-size:14px;
    resize:vertical;
    background:#fff;
    color:#0b1220;
    outline:none;
  }
  textarea::placeholder{color:#9aa6b2}
  .controls{display:flex;gap:10px;margin-top:12px}
  button.primary{
    flex:1;padding:12px;border-radius:10px;border:0;background:var(--accent);color:white;font-weight:700;cursor:pointer;
  }
  button.ghost{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
  button:disabled{opacity:0.6;cursor:not-allowed}
  .stats{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:10px;border-radius:10px;background:linear-gradient(180deg,#ffffff,#fbfdff);border:1px solid var(--line)}
  .summary{font-weight:700;color:#0b1220}
  .counts{color:var(--muted);font-weight:600}
  .progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden;flex:1;margin-left:12px;margin-right:12px}
  .bar{height:100%;background:linear-gradient(90deg,#60a5fa,#06b6d4);width:0%}
  .log{margin-top:12px;height:360px;overflow:auto;border-radius:10px;padding:10px;background:#ffffff;border:1px solid var(--line);font:var(--mono);color:#0b1220}
  .row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:8px;margin-bottom:6px}
  .idx{min-width:36px;color:#94a3b8;font-weight:700}
  .email{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .status{min-width:140px;text-align:right;font-weight:700}
  .ok{background:linear-gradient(90deg, rgba(22,163,74,0.12), rgba(22,163,74,0.06));color:var(--success)}
  .bad{background:linear-gradient(90deg, rgba(239,68,68,0.06), rgba(239,68,68,0.03));color:var(--danger)}
  .info{background:transparent;color:var(--muted)}
  .note{font-size:12px;color:var(--muted);margin-top:10px}
  .copy-btn{min-width:140px}
  @media (max-width:760px){
    .grid{flex-direction:column}
    .log{height:220px}
    textarea{min-height:100px}
    .controls{flex-direction:column}
    .copy-btn{width:100%}
  }
</style>
</head>
<body>
  <div class="card" role="main">
    <div class="head">
      <div class="logo">G</div>
      <div>
        <h1>Gmail App Password Checker</h1>
        <p class="sub">Clean, minimal UI — sequential checks — one row per email</p>
      </div>
    </div>

    <div class="grid">
      <div class="col">
        <label for="emails">Emails (one per line)</label>
        <textarea id="emails" placeholder="alice@gmail.com
bob@gmail.com" inputmode="email" spellcheck="false"></textarea>
      </div>
      <div class="col">
        <label for="passwords">App passwords (one per line)</label>
        <textarea id="passwords" placeholder="abcd efgh ijkl mnop
qrst uvwx yzab cdef" spellcheck="false"></textarea>
      </div>
    </div>

    <div class="controls">
      <button id="checkBtn" class="primary" type="button">Check</button>
      <button id="copyBtn" class="ghost copy-btn" type="button" disabled title="Copy emoji results (one per line) to clipboard">Copy Results</button>
      <button id="clearBtn" class="ghost" type="button">Clear Logs</button>
    </div>

    <div class="stats" aria-live="polite">
      <div class="summary" id="summary">Ready — 0 total</div>
      <div style="display:flex;align-items:center;flex:1">
        <div class="counts" id="counts">0 ✅ | 0 ❌</div>
        <div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>
      </div>
    </div>

    <div id="logs" class="log" aria-live="polite" aria-atomic="false">
      <!-- rows inserted here -->
    </div>

    <div class="note" id="note">Endpoint: POST /check-single — payload: { "email", "password" } — expects { "isValid": true/false }</div>
  </div>

<script>
/*
 - Sequential checking, one DOM row per email (created once).
 - Duplicate emails are removed (first occurrence kept).
 - Copy Results button copies one emoji per email in the processed order (✅ or ❌), each on its own line,
   so pasting into Google Sheets column A will place each emoji into its own row.
*/

(function(){
  const emailsEl = document.getElementById('emails');
  const passwordsEl = document.getElementById('passwords');
  const checkBtn = document.getElementById('checkBtn');
  const copyBtn = document.getElementById('copyBtn');
  const clearBtn = document.getElementById('clearBtn');
  const logsEl = document.getElementById('logs');
  const summaryEl = document.getElementById('summary');
  const countsEl = document.getElementById('counts');
  const barEl = document.getElementById('bar');

  const TIMEOUT_MS = 25000;
  const MAX_LOGS = 800; // safety, though we render one row per email

  let pairs = [];      // deduped {email, password}
  let results = [];    // same length as pairs, '✅' or '❌' or ''
  let running = false;

  function splitLines(s){
    return (s || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  }

  function setRunning(r){
    running = r;
    checkBtn.disabled = r;
    emailsEl.readOnly = r;
    passwordsEl.readOnly = r;
    copyBtn.disabled = !(!r && results.length > 0);
  }

  function updateSummary(total, done, ok, failed){
    summaryEl.textContent = `Total ${total} • Done ${done}`;
    countsEl.textContent = `${ok} ✅ | ${failed} ❌`;
    const pct = total === 0 ? 0 : Math.round((done/total)*100);
    barEl.style.width = pct + '%';
  }

  function createRow(i, email){
    const row = document.createElement('div');
    row.className = 'row info';
    row.dataset.idx = i;
    const idx = document.createElement('div'); idx.className='idx'; idx.textContent = (i+1);
    const em = document.createElement('div'); em.className='email'; em.textContent = email;
    const st = document.createElement('div'); st.className='status'; st.textContent = 'Pending';
    row.appendChild(idx);
    row.appendChild(em);
    row.appendChild(st);
    logsEl.appendChild(row);
    return row;
  }

  function setRowStatus(i, kind, text){
    // kind: 'ok' | 'bad' | 'info'
    const row = logsEl.querySelector(`.row[data-idx="${i}"]`);
    if (!row) return;
    row.classList.remove('info','ok','bad');
    row.classList.add(kind === 'ok' ? 'ok' : kind === 'bad' ? 'bad' : 'info');
    const st = row.querySelector('.status');
    if (st) st.textContent = text;
    // scroll to updated row
    row.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  function timeoutSignal(ms){
    const ac = new AbortController();
    const id = setTimeout(()=>ac.abort(), ms);
    return { signal: ac.signal, clear: ()=>clearTimeout(id) };
  }

  async function postCheck(email, password){
    const { signal, clear } = timeoutSignal(TIMEOUT_MS);
    try {
      const res = await fetch('/check-single', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email, password }),
        signal
      });
      clear();
      if (!res.ok) return { ok:false, err:`HTTP ${res.status}` };
      const data = await res.json();
      return { ok: !!(data && data.isValid) };
    } catch (err) {
      const name = err && err.name === 'AbortError' ? 'Timeout' : 'Network';
      return { ok:false, err: name };
    }
  }

  // Build deduped pairs and render one row per pair
  function preparePairs(rawEmails, rawPasswords){
    const seen = new Set();
    const outPairs = [];
    for (let i = 0; i < rawEmails.length; i++){
      const e = rawEmails[i];
      const p = rawPasswords[i] ?? '';
      const key = e.toLowerCase();
      if (!seen.has(key)){
        seen.add(key);
        outPairs.push({ email: e, password: p });
      }
    }
    return outPairs;
  }

  async function start(){
    if (running) return;
    const rawEmails = splitLines(emailsEl.value);
    const rawPasswords = splitLines(passwordsEl.value);

    if (rawEmails.length === 0 || rawPasswords.length === 0){
      alert('Please provide both email and password lists.');
      return;
    }
    if (rawEmails.length !== rawPasswords.length){
      alert(`Email count (${rawEmails.length}) and password count (${rawPasswords.length}) are not equal.`);
      return;
    }

    pairs = preparePairs(rawEmails, rawPasswords);
    results = new Array(pairs.length).fill(''); // empty until checked

    // render rows once
    logsEl.innerHTML = '';
    // optional: show duplicates info
    const dupCount = rawEmails.length - pairs.length;
    if (dupCount > 0){
      const info = document.createElement('div');
      info.className = 'row info';
      info.style.fontStyle = 'italic';
      info.textContent = `Duplicates removed: ${dupCount} (first occurrence kept)`;
      logsEl.appendChild(info);
    }
    pairs.forEach((p, i) => createRow(i, p.email));

    setRunning(true);
    updateSummary(pairs.length, 0, 0, 0);

    let ok = 0, failed = 0, done = 0;
    for (let i = 0; i < pairs.length; i++){
      const pair = pairs[i];
      // show checking state
      setRowStatus(i, 'info', 'Checking...');
      // sequential call
      const r = await postCheck(pair.email, pair.password);
      if (r.ok){
        results[i] = '✅';
        ok++;
        setRowStatus(i, 'ok', 'Success ✅');
      } else {
        results[i] = '❌';
        failed++;
        setRowStatus(i, 'bad', `Failed ❌${r.err ? ' ('+r.err+')' : ''}`);
      }
      done++;
      updateSummary(pairs.length, done, ok, failed);
      // brief yield so UI can update smoothly on low-end devices
      await new Promise(res => setTimeout(res, 25));
    }

    // finished
    const finish = document.createElement('div');
    finish.className = 'row info';
    finish.textContent = `Completed: ${ok} success, ${failed} failed`;
    logsEl.appendChild(finish);

    // enable copy button
    copyBtn.disabled = results.length === 0;
    setRunning(false);
  }

  // Copy results: one emoji per line in same order as displayed rows
  async function copyResults(){
    if (!results || results.length === 0) return;
    const payload = results.join('\n');
    try {
      await navigator.clipboard.writeText(payload);
      const orig = copyBtn.textContent;
      copyBtn.textContent = 'Copied ✓';
      setTimeout(()=> copyBtn.textContent = orig, 1200);
    } catch (err) {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = payload;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        copyBtn.textContent = 'Copied ✓';
        setTimeout(()=> copyBtn.textContent = 'Copy Results', 1200);
      } finally {
        document.body.removeChild(ta);
      }
    }
  }

  checkBtn.addEventListener('click', start);
  copyBtn.addEventListener('click', copyResults);
  clearBtn.addEventListener('click', () => {
    logsEl.innerHTML = '';
    pairs = [];
    results = [];
    setRunning(false);
    updateSummary(0,0,0,0);
    copyBtn.disabled = true;
  });

  // init
  setRunning(false);
  updateSummary(0,0,0,0);
  copyBtn.disabled = true;
})();
</script>
</body>
</html>
