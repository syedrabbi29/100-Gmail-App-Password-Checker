<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gmail App Password Checker</title>
<style>
  :root{
    --bg: #0f1724;
    --card: #0b1220;
    --muted: #94a3b8;
    --accent: linear-gradient(90deg,#06b6d4,#60a5fa);
    --glass: rgba(255,255,255,0.04);
    --success: #10b981;
    --danger: #ef4444;
    --max-width:900px;
    --log-font: 13px/1.4 "SFMono-Regular",Menlo,Monaco,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:linear-gradient(180deg,#071022 0%, #07162b 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;color:#e6eef8}
  .wrap{max-width:var(--max-width);margin:20px auto;padding:20px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,0.02), rgba(255,255,255,0.01));box-shadow:0 10px 30px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03)}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
  .title {display:flex;gap:12px;align-items:center}
  .logo {
    width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#60a5fa,#06b6d4);display:grid;place-items:center;color:white;font-weight:800;box-shadow:0 6px 18px rgba(6,165,255,0.16)
  }
  h1{font-size:18px;margin:0}
  p.lead{margin:0;color:var(--muted);font-size:13px}
  .grid{display:flex;gap:14px;margin-top:10px}
  .col{flex:1;display:flex;flex-direction:column;gap:8px}
  label{font-size:13px;color:#cfe8ff;font-weight:600}
  textarea{width:100%;min-height:150px;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));color:#e6eef8;resize:vertical;font-size:14px;outline:none}
  textarea::placeholder{color:#6b7786}
  .controls{display:flex;gap:10px;margin-top:10px;align-items:center}
  button.primary{
    padding:12px 18px;border-radius:10px;border:0;background:linear-gradient(90deg,#06b6d4,#60a5fa);color:#06203a;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 6px 18px rgba(6,165,255,0.12);
  }
  button.ghost{padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--muted);cursor:pointer}
  button:disabled{opacity:0.5;cursor:not-allowed}
  .stats{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:12px;border-radius:12px;background:var(--glass);border:1px solid rgba(255,255,255,0.02)}
  .stats .left{display:flex;flex-direction:column}
  .big{font-weight:800;font-size:15px;color:#e6f7ff}
  .small{font-size:13px;color:var(--muted)}
  .progress-wrap{display:flex;align-items:center;gap:12px;flex:1}
  .progress{height:8px;background:rgba(255,255,255,0.03);border-radius:999px;overflow:hidden;flex:1}
  .bar{height:100%;background:linear-gradient(90deg,#06b6d4,#60a5fa);width:0%}
  .log-box{margin-top:12px;height:320px;overflow:auto;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.02);font:var(--log-font);color:#dff6ff}
  .line{display:flex;align-items:center;gap:12px;padding:8px;border-radius:8px}
  .index{min-width:36px;color:#9fb8cf;font-weight:700}
  .email{flex:1;color:#e6f7ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .status{min-width:120px;text-align:right;font-weight:700}
  .ok{color:var(--success)}
  .bad{color:var(--danger)}
  .info{color:#f59e0b}
  footer.meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:13px}
  .hint{font-size:12px;color:var(--muted)}
  @media (max-width:800px){
    .grid{flex-direction:column}
    textarea{min-height:110px}
    .log-box{height:220px}
  }
</style>
</head>
<body>
  <div class="wrap" role="main">
    <header>
      <div class="title">
        <div class="logo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 7a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7z" fill="#fff" opacity="0.12"/><path d="M4 8.5a8 8 0 0 0 16 0" stroke="#fff" stroke-opacity="0.85" stroke-width="1.2" stroke-linecap="round"/></svg></div>
        <div>
          <h1>Gmail App Password Checker</h1>
          <p class="lead">Sequential checks · lightweight · mobile-optimized</p>
        </div>
      </div>
      <div style="text-align:right">
        <div class="small">Endpoint: <code style="background:rgba(255,255,255,0.03);padding:4px 8px;border-radius:6px;color:#bfe8ff">POST /check-single</code></div>
      </div>
    </header>

    <form id="checker" onsubmit="return false" autocomplete="off" novalidate>
      <div class="grid">
        <div class="col">
          <label for="emails">Email list (one per line)</label>
          <textarea id="emails" placeholder="alice@gmail.com
bob@gmail.com" inputmode="email" spellcheck="false"></textarea>
        </div>
        <div class="col">
          <label for="passwords">App password list (one per line)</label>
          <textarea id="passwords" placeholder="abcd efgh ijkl mnop
qrst uvwx yzab cdef" spellcheck="false" ></textarea>
        </div>
      </div>

      <div class="controls">
        <button id="checkBtn" class="primary" type="button">Check</button>
        <button id="clearBtn" class="ghost" type="button">Clear Logs</button>
      </div>

      <div class="stats" role="status" aria-live="polite">
        <div class="left">
          <div class="big" id="summary">Ready — 0 total</div>
          <div class="small" id="sub">Idle</div>
        </div>
        <div class="progress-wrap">
          <div class="small">Progress</div>
          <div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>
          <div class="small" id="counts">0 ✅ | 0 ❌</div>
        </div>
      </div>

      <div id="logs" class="log-box" aria-live="polite" aria-atomic="false">
        1) Results will appear here...
      </div>

      <footer class="meta">
        <div class="hint">Sequential, one request per email. Network timeout per request: 25s.</div>
        <div class="hint">UI only — backend must implement /check-single</div>
      </footer>
    </form>
  </div>

<script>
/* Sequential checker (follows original logic) — optimized DOM updates, limited logs to save memory */
(function(){
  const emailsEl = document.getElementById('emails');
  const passwordsEl = document.getElementById('passwords');
  const checkBtn = document.getElementById('checkBtn');
  const clearBtn = document.getElementById('clearBtn');
  const logsEl = document.getElementById('logs');
  const summaryEl = document.getElementById('summary');
  const subEl = document.getElementById('sub');
  const countsEl = document.getElementById('counts');
  const barEl = document.getElementById('bar');

  const TIMEOUT_MS = 25000;   // per-request timeout
  const MAX_LOGS = 300;       // keep DOM light

  function splitLines(s){
    return (s || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  }

  function setButtonState(running){
    checkBtn.disabled = running;
    checkBtn.textContent = running ? 'Checking...' : 'Check';
  }

  function appendLine(index, email, status, text){
    // status: 'success' | 'failed' | 'info'
    const row = document.createElement('div');
    row.className = 'line';
    const idx = document.createElement('div');
    idx.className = 'index';
    idx.textContent = `${index}`;
    const em = document.createElement('div');
    em.className = 'email';
    em.textContent = email;
    const st = document.createElement('div');
    st.className = 'status';

    if (status === 'success') {
      st.classList.add('ok');
      st.textContent = `Success ✅ ${text || ''}`;
    } else if (status === 'failed') {
      st.classList.add('bad');
      st.textContent = `Failed ❌ ${text || ''}`;
    } else {
      st.classList.add('info');
      st.textContent = `${text || ''}`;
    }

    row.appendChild(idx);
    row.appendChild(em);
    row.appendChild(st);
    logsEl.appendChild(row);

    // auto-scroll to bottom
    logsEl.scrollTop = logsEl.scrollHeight;

    // trim old log entries
    while (logsEl.children.length > MAX_LOGS) {
      logsEl.removeChild(logsEl.firstChild);
    }
  }

  function updateSummary(total, done, ok, failed){
    summaryEl.textContent = `Total ${total} • Done ${done}`;
    countsEl.textContent = `${ok} ✅ | ${failed} ❌`;
    subEl.textContent = done < total ? `Checking (${done}/${total})` : (total === 0 ? 'Idle' : 'Completed');
    const pct = total === 0 ? 0 : Math.round((done/total)*100);
    barEl.style.width = pct + '%';
  }

  function createTimeoutSignal(ms){
    const ac = new AbortController();
    const id = setTimeout(() => ac.abort(), ms);
    return { signal: ac.signal, clear: () => clearTimeout(id) };
  }

  async function postCheck(email, password){
    const { signal, clear } = createTimeoutSignal(TIMEOUT_MS);
    try {
      const res = await fetch('/check-single', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email, password }),
        signal
      });
      clear();
      if (!res.ok) {
        return { ok: false, error: `HTTP ${res.status}` };
      }
      const data = await res.json();
      const valid = !!(data && data.isValid);
      return { ok: valid };
    } catch (err) {
      const name = err && err.name === 'AbortError' ? 'Timeout' : 'Network';
      return { ok: false, error: name };
    }
  }

  async function startChecking(){
    const emails = splitLines(emailsEl.value);
    const passwords = splitLines(passwordsEl.value);

    if (emails.length === 0 || passwords.length === 0) {
      alert('Please provide both email and password lists.');
      return;
    }
    if (emails.length !== passwords.length) {
      alert(`Email count (${emails.length}) and password count (${passwords.length}) are not equal!`);
      return;
    }

    setButtonState(true);
    logsEl.innerHTML = ''; // fresh logs
    appendLine(1, '—', 'info', 'Starting checks...');

    let success = 0, failed = 0, done = 0;
    const total = emails.length;

    updateSummary(total, done, success, failed);

    for (let i = 0; i < total; i++) {
      const email = emails[i];
      const password = passwords[i];
      // show checking info line
      appendLine(i+1, email, 'info', 'Checking...');
      // sequential request (await)
      const result = await postCheck(email, password);
      if (result.ok) {
        success++;
        appendLine(i+1, email, 'success', '');
      } else {
        failed++;
        appendLine(i+1, email, 'failed', result.error || '');
      }
      done++;
      updateSummary(total, done, success, failed);
      // small yield to UI for better responsiveness on low-end devices
      await new Promise(r => setTimeout(r, 50));
    }

    appendLine(total+1, '—', 'info', `Completed: ${success} success, ${failed} failed`);
    updateSummary(total, total, success, failed);
    setButtonState(false);
  }

  checkBtn.addEventListener('click', startChecking);

  clearBtn.addEventListener('click', () => {
    logsEl.innerHTML = 'Cleared logs';
    setTimeout(() => { if (logsEl.innerHTML === 'Cleared logs') logsEl.innerHTML = ''; }, 600);
  });

  // Initial UI
  updateSummary(0,0,0,0);
})();
</script>
</body>
</html>
